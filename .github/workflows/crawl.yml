name: crawl-detect-notify

on:
  workflow_dispatch:          # primary: external pinger every 10 min
  schedule:
    - cron: "23,53 * * * *"   # backup only (GitHub cron jitter measured p50 +31 min)

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - name: Install deps
        run: pip install -q -r requirements.txt

      - name: Crawl to tip
        id: crawl
        run: python3 crawl.py 2>&1 | tail -5

      - name: Detect
        id: detect
        if: hashFiles('detect/run.py') != ''
        env:
          MINDSET_SALT: ${{ secrets.MINDSET_SALT }}
        run: python3 detect/run.py --quiet

      - name: PII gate
        run: python3 tests/test_pii.py --tree .

      - name: Commit state
        run: |
          git config user.name  "moca-ledger-bot"
          git config user.email "actions@users.noreply.github.com"  # pii-ok: github bot identity
          git add -A                                  # -A, never an explicit list (see 2026-07-20 incident)
          git diff --cached --quiet || git commit -q -m "crawl $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -q origin main || git rebase --abort || true
            git push -q origin main && break || sleep 5
          done

      - name: Notify (page/notify/digest)
        if: hashFiles('notify/telegram.py') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ACK_USER_IDS: ${{ secrets.TELEGRAM_ACK_USER_IDS }}
        run: python3 notify/telegram.py --send-pending


      - name: Request tier-2 enrichment (private side)
        if: success()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          [ -z "$PRIVATE_REPO_PAT" ] && { echo "no PAT — private side will pick it up on its hourly pass"; exit 0; }
          ids=$(python3 - <<'PY2'
import json,pathlib
s=json.loads(pathlib.Path("alerts/state.json").read_text())
ids=[f.get("id") for f in (s.get("open") or {}).values()
     if f.get("tier") in ("page","notify") and not f.get("pending_send")
     and f.get("ack_by")!="go-live-seed" and not f.get("enrich_requested")]
print(" ".join(i for i in ids if i)[:400])
PY2
)
          for id in $ids; do
            curl -sS -X POST -H "Authorization: Bearer $PRIVATE_REPO_PAT" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Agentic-Po/moca-ledger-private/dispatches \
              -d "{\"event_type\":\"finding\",\"client_payload\":{\"finding_id\":\"$id\"}}" -o /dev/null -w "dispatch $id: %{http_code}\n"
          done
          python3 - <<'PY3'
import json,pathlib
p=pathlib.Path("alerts/state.json"); s=json.loads(p.read_text())
for f in (s.get("open") or {}).values():
    if f.get("tier") in ("page","notify") and not f.get("pending_send") and f.get("ack_by")!="go-live-seed":
        f["enrich_requested"]=True
p.write_text(json.dumps(s,indent=1))
PY3

      - name: Heartbeat ping (success only)
        if: success()
        env: { HC_PING_URL: "${{ secrets.HC_PING_URL }}" }
        run: curl -fsS -m 10 --retry 2 "$HC_PING_URL" > /dev/null && echo pinged

      - name: Failure notice (deduped)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 notify/telegram.py --failure "$RUN_URL" || true
