name: crawl-detect-notify

on:
  workflow_dispatch:          # manual / ad-hoc runs
  schedule:
    - cron: "*/10 * * * *"    # the only automatic trigger (council decision 2026-08-22); GitHub cron drifts, that is accepted

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Heartbeat ping (start)
        env: { HC_PING_URL: "${{ secrets.HC_PING_URL }}" }
        run: curl -fsS -m 10 "$HC_PING_URL/start" > /dev/null || true

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - name: Install deps
        run: pip install -q -r requirements.txt

      # `set -o pipefail` is load-bearing: Actions runs `run:` under `bash -e`, not
      # `-eo pipefail`, so the step status was tail's, which is always 0. A crashed
      # crawler left the step GREEN, detect and notify then ran on stale chain data,
      # and the heartbeat pinged success.
      - name: Crawl to tip
        id: crawl
        run: |
          set -o pipefail
          python3 crawl.py 2>&1 | tail -5

      # NEVER add `|| true` here. A failed restore means a stateless run, which
      # re-sends every finding the human already handled. It must stop the job.
      - name: Restore detector memory (private repo)
        env: { PRIVATE_REPO_PAT: "${{ secrets.PRIVATE_REPO_PAT }}" }
        run: python3 notify/state_sync.py pull

      - name: Detect
        id: detect
        if: hashFiles('detect/run.py') != ''
        env:
          MINDSET_SALT:    ${{ secrets.MINDSET_SALT }}
          EXIT_WATCH_JSON: ${{ secrets.EXIT_WATCH_JSON }}
          # detect/thresholds.json has documented this override since it was written and
          # nothing ever passed it, so shadow mode had no switch. Unset it is an empty
          # string and nothing changes; malformed, signals/__init__.py now says so.
          THRESHOLDS_JSON: ${{ secrets.THRESHOLDS_JSON }}
        run: |
          if [ -n "$EXIT_WATCH_JSON" ]; then
            printf '%s' "$EXIT_WATCH_JSON" > labels/exit_watch.json
          fi
          python3 detect/run.py --quiet

      # ABOVE the PII gate on purpose (moved 2026-08-30): catalog.json and
      # DATASETS.md are written by this step and committed by `git add -A`
      # below, so with the rebuild after the gate the gate only ever scanned
      # the OLD checked-out copies and the new ones were published unscanned —
      # the exact hazard tests/test_pii.py's files() docstring names. It still
      # rides with the data it measures (it is before "Commit state"), it just
      # now passes the gate that is supposed to see it. Never blocking: a
      # catalog is documentation.
      - name: Rebuild data catalog
        continue-on-error: true
        run: python3 catalog.py

      # STOPS the job on purpose. A leak is the one failure that cannot be undone —
      # members forward and deleteMessage recalls nothing — so not sending is right.
      - name: PII gate
        run: python3 tests/test_pii.py --tree .

      # Behaviour, not privacy: incident mode ends on its TTL, a cash-out gets a slot
      # during a burst, a snoozed finding is held rather than dropped, a reply of "not
      # yet contained" records nothing, no chart carries a threshold. It sends nothing
      # and never touches alerts/state.json.
      #
      # continue-on-error is load-bearing. This step sits directly above the live send
      # path under `bash -e`, so while it was blocking, one red check here did not fail
      # a test run — it stopped Notify, stopped commands.py reading replies, and stopped
      # the state push, EVERY TEN MINUTES, on a schedule, until a person happened to
      # open the Actions tab. A behaviour regression is not a reason to take the channel
      # dark for hours; ci.yml already gates it on push, and a leak is the only failure
      # worth refusing to send over. The run still goes RED and the group is still told
      # (see --gate-failed in the Notify step) — the outcome that is forbidden here is
      # a channel that is quiet and nobody knows why.
      - name: Alerting behaviour gate
        id: behaviour_gate
        continue-on-error: true
        run: python3 tests/test_notify.py

      - name: Notify (page/notify/digest)
        if: hashFiles('notify/telegram.py') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ACK_USER_IDS: ${{ secrets.TELEGRAM_ACK_USER_IDS }}
          PRIVATE_REPO_PAT:   ${{ secrets.PRIVATE_REPO_PAT }}
          # The pause authority is a real person's name and handle, and this repo is
          # public. explain.py reads the block from here first so the one person who can
          # stop the money is named in the group and not on the internet.
          THRESHOLDS_JSON:    ${{ secrets.THRESHOLDS_JSON }}
          BEHAVIOUR_GATE:     ${{ steps.behaviour_gate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rc=0
          # Say it in the channel, not only in a log nobody is reading at 04:00.
          if [ "$BEHAVIOUR_GATE" = "failure" ]; then
            echo "alerting behaviour gate FAILED — alerts still going out, run will be red"
            python3 notify/telegram.py --gate-failed "$RUN_URL" || echo "could not announce the gate failure"
            rc=1
          fi
          # Alerts must still go out even when the reply loop, the watchdog or the
          # message ledger is broken — but the run must go RED afterwards. "Green and
          # blind" is the failure class this whole channel exists to avoid (§6.2).
          #
          # msglog pull/push brackets the whole block: `pull` so a reply can be matched
          # against messages sent by earlier runs (the runner is disposable), `push` so
          # this run's messages are matchable by the next. Unlike the state restore, a
          # failed pull does NOT stop the job — the ledger is for matching, not for
          # deciding what to send, and push merges by line union rather than
          # overwriting, so a partial local copy cannot truncate the remote.
          python3 notify/msglog.py pull || { echo "msglog pull exited non-zero"; rc=1; }
          python3 notify/commands.py || { echo "commands.py exited non-zero"; rc=1; }
          python3 notify/watchdog.py || { echo "watchdog.py exited non-zero"; rc=1; }
          python3 notify/telegram.py --send-pending || { echo "telegram.py --send-pending exited non-zero"; rc=1; }
          # Proof of life, once per UTC day, keyed off state — so calling it every run is
          # cheap and idempotent. Po's ask: a channel that is silent for days cannot be
          # told apart from one that is dead. It refuses to be reassuring when the
          # detector is running but blind, and it goes red if it could not be delivered,
          # because the one message whose job is to prove we are not silent must not fail
          # silently itself.
          python3 notify/telegram.py --heartbeat || { echo "heartbeat exited non-zero"; rc=1; }
          python3 notify/msglog.py push || { echo "msglog push exited non-zero"; rc=1; }
          exit $rc


      - name: Save detector memory (private repo)
        if: always()
        env: { PRIVATE_REPO_PAT: "${{ secrets.PRIVATE_REPO_PAT }}" }
        run: python3 notify/state_sync.py push

      - name: Commit state
        run: |
          git config user.name  "moca-ledger-bot"
          git config user.email "actions@users.noreply.github.com"  # pii-ok: github bot identity
          git add -A                                  # -A, never an explicit list (see 2026-07-20 incident)
          git diff --cached --quiet || git commit -q -m "crawl $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -q origin main || git rebase --abort || true
            git push -q origin main && break || sleep 5
          done

      # After the commit on purpose: a rejected dispatch or a dropped state push is
      # a real error and goes red, but it must not cost the crawl its commit.
      - name: Request tier-2 enrichment (private side)
        if: success()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: python3 notify/request_enrichment.py

      # This workflow has exactly ONE healthchecks.io ping path: the
      # HC_PING_URL start/success/fail triple (start above, success/failure
      # below), which drives the "moca-ledger detection floor" check. A
      # second, never-configured secrets.HEALTHCHECK_URL dead-man step was
      # removed 2026-08-30 — two half-wired ping paths in one workflow is how
      # silent no-op secrets survive. The skill-payout-dashboard repo has its
      # own separate check; see its RUNBOOK-deadman.md for the mapping.
      - name: Heartbeat ping (success)
        if: success()
        env: { HC_PING_URL: "${{ secrets.HC_PING_URL }}" }
        run: curl -fsS -m 10 --retry 2 "$HC_PING_URL" > /dev/null && echo pinged

      - name: Heartbeat ping (failure)
        if: failure()
        env: { HC_PING_URL: "${{ secrets.HC_PING_URL }}" }
        run: curl -fsS -m 10 --retry 2 "$HC_PING_URL/fail" > /dev/null || true

      - name: Failure notice (deduped)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 notify/telegram.py --failure "$RUN_URL" || true
