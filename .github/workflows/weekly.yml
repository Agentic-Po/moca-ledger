name: weekly-keepalive
on:
  schedule:
    - cron: "11 6 * * 1"     # Mondays 06:11 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Open findings are detector status and live only in the private state now
      # (notify/health.py). Read-only pull; this job never pushes the state. A failed
      # pull only costs the weekly message its open-findings line.
      - name: Restore detector memory (private repo, read-only)
        env: { PRIVATE_REPO_PAT: "${{ secrets.PRIVATE_REPO_PAT }}" }
        run: python3 notify/state_sync.py pull || echo "state pull failed — weekly notice will omit open findings"
      - name: Stamp liveness and report the run gap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIVATE_REPO_PAT:   ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          python3 notify/msglog.py pull || echo "msglog pull failed — this notice may be unmatchable"
          rc=0
          python3 notify/weekly.py || rc=$?
          python3 notify/msglog.py push || echo "msglog push failed — this notice may be unmatchable"
          exit $rc
      - name: Commit stamp
        run: |
          git config user.name  "moca-ledger-bot"
          git config user.email "actions@users.noreply.github.com"  # pii-ok: github bot identity
          git add -A
          git diff --cached --quiet || git commit -q -m "weekly keepalive $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -q origin main || git rebase --abort || true; git push -q origin main && break || sleep 5; done
