name: ci
on:
  push:    { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # Full history: catalog.py dates labels/ by each file's last COMMIT,
        # which a shallow clone cannot see (it then carries the committed
        # values, making the catalog gate below vacuous for that dataset).
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: Automatic triage regression
        run: python3 -m unittest discover -s tests -p test_triage.py
      - name: Health delivery regression
        run: python3 -m unittest discover -s tests -p test_health_delivery.py
      - name: Reward policy regression
        run: python3 tests/test_reward_policy.py
      - name: PII gate
        run: python3 tests/test_pii.py --tree .
      # The detector gate evaluates the real oracle, which is private now. Read-only,
      # the same token crawl.yml restores with; a fork PR has no secrets and the gate
      # then fails on the missing labels-lite.json, which is the honest outcome.
      - name: Restore detector oracle (private repo)
        env: { PRIVATE_REPO_PAT: "${{ secrets.PRIVATE_REPO_PAT }}" }
        run: python3 notify/state_sync.py pull-oracle
      - name: Quiet-log gate (no detector status in public Actions logs)
        run: python3 tests/test_quiet_logs.py
      - name: State gate (size cap, restore fallback, no enrichment re-dispatch)
        run: python3 tests/test_state.py
      # Also runs inside crawl.yml, but that is every ten minutes on the live channel.
      # A push must be able to fail here, before it reaches the group.
      - name: Alerting behaviour gate (incident mode, replies, leaks)
        run: python3 tests/test_notify.py
      # crawl.yml only ever runs the unconditional build, under
      # continue-on-error — so a catalog.py that starts raising goes amber and
      # the stale catalog.json is committed unchanged every ten minutes,
      # forever. This is the blocking gate behind "the catalog cannot drift".
      - name: Catalog gate (committed catalog vs recompute)
        run: python3 catalog.py --check
      - name: Detector gate (replay deadlines + benign windows + parity)
        env: { MINDSET_SALT: "${{ secrets.MINDSET_SALT }}" }
        run: python3 tests/test_gate.py
